<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiemenS Tether App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
--bg-color: #0f172a;
--card-bg: #1e293b;
--accent-color: #22c55e;
--text-color: #f8fafc;
--subtext-color: #94a3b8;
}
body {
background-color: var(--bg-color);
color: var(--text-color);
font-family: system-ui, -apple-system, sans-serif;
margin: 0;
padding: 20px;
display: flex;
flex-direction: column;
align-items: center;
}
.card {
background-color: var(--card-bg);
border-radius: 16px;
padding: 20px;
width: 100%;
max-width: 350px;
box-shadow: 0 10px 25px rgba(0,0,0,0.3);
text-align: center;
margin-bottom: 15px;
border: 1px solid rgba(255,255,255,0.05);
}
.balance-title { font-size: 14px; color: var(--subtext-color); }
.balance-amount { font-size: 32px; font-weight: bold; color: var(--accent-color); margin: 10px 0; }
.btn-group { display: flex; gap: 10px; width: 100%; max-width: 350px; margin-bottom: 20px; }
.btn {
flex: 1;
padding: 12px;
border: none;
border-radius: 12px;
font-weight: bold;
cursor: pointer;
transition: transform 0.1s;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background-color: var(--accent-color); color: #000; }
.btn-secondary { background-color: var(--card-bg); color: var(--text-color); border: 1px solid rgba(255,255,255,0.1); }
.user-info { font-size: 14px; color: var(--subtext-color); margin-bottom: 15px; }
</style>
</head>
<body>

<div class="user-info" id="userInfo">در حال دریافت اطلاعات کاربر...</div>

<div class="card">
<div class="balance-title">موجودی کل (USDT)</div>
<div class="balance-amount" id="balance">0.00 $</div>
</div>

<div class="btn-group">
<button class="btn btn-primary" onclick="alert('بخش واریز بزودی فعال می‌شود')">واریز</button>
<button class="btn btn-secondary" onclick="alert('بخش برداشت بزودی فعال می‌شود')">برداشت</button>
</div>

<div class="card">
<h3>🎁 پاداش روزانه</h3>
<p style="font-size: 12px; color: var(--subtext-color);">هر روز سر بزن و ۱ تتر رایگان بگیر!</p>
<button class="btn btn-primary" style="width: 100%;" onclick="claimDaily()">دریافت پاداش امروز</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
const user = tg.initDataUnsafe.user;
document.getElementById('userInfo').innerText = `خوش آمدی ${user.first_name}!`;
}

let currentBalance = 0.00;

function claimDaily() {
currentBalance += 1.00;
document.getElementById('balance').innerText = currentBalance.toFixed(2) + ' $';
alert('۱ تتر پاداش روزانه به حساب شما اضافه شد!');
}
</script>
</body>
</html>
