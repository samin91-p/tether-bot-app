<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiemenS Tether App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.9);
            --accent-color: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        * { box-sizing: border-box; user-select: none; }
        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 15px 100px 15px;
            min-height: 100vh;
        }
        .container { max-width: 450px; margin: 0 auto; }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            text-align: center;
        }
        .balance-title { font-size: 14px; color: var(--text-sub); margin-bottom: 5px; }
        .balance-amount { font-size: 32px; font-weight: bold; color: var(--accent-color); }
        .btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #loading { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">در حال اتصال به سرور...</div>
        <div class="card">
            <div class="balance-title">موجودی حساب شما</div>
            <div class="balance-amount"><span id="balance">0.00</span> USDT</div>
        </div>
        <div class="card">
            <div class="balance-title">پاداش روزانه</div>
            <button id="claimBtn" class="btn" onclick="claimDaily()">دریافت پاداش</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const SERVER_URL = 'https://tether-bot-app.onrender.com';
        const user = tg.initDataUnsafe?.user || { id: 123456, first_name: "تست" };

        async function loadUserData() {
            try {
                const res = await fetch(${SERVER_URL}/api/user/${user.id});
                const data = await res.json();
                document.getElementById('balance').innerText = data.balance.toFixed(2);
                document.getElementById('loading').style.display = 'none';
            } catch (err) {
                document.getElementById('loading').innerText = 'خطا در برقراری ارتباط با سرور';
            }
        }

        async function claimDaily() {
            const btn = document.getElementById('claimBtn');
            btn.disabled = true;
            try {
                const res = await fetch(${SERVER_URL}/api/claim, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: user.id })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('balance').innerText = data.newBalance.toFixed(2);
                    alert('پاداش روزانه با موفقیت دریافت شد!');
                } else {
                    alert(data.message || 'قبلاً دریافت کرده‌اید.');
                }
            } catch (err) {
                alert('خطایی رخ داد.');
            }
            btn.disabled = false;
        }

        loadUserData();
    </script>
</body>
</html>
