<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiemenS Investment App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; text-align: center; }
.header { margin-bottom: 25px; }
.balance-card { background: linear-gradient(135deg, #1e293b, #334155); border-radius: 16px; padding: 20px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); border: 1px solid #475569; margin-bottom: 20px; }
.balance-title { font-size: 14px; color: #94a3b8; }
.balance-amount { font-size: 32px; font-weight: bold; color: #38bdf8; margin: 10px 0; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.stat-box { background: #1e293b; padding: 15px; border-radius: 12px; border: 1px solid #334155; }
.stat-value { font-weight: bold; color: #4ade80; margin-top: 5px; }
.btn { background: #0284c7; color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
.btn:active { transform: scale(0.98); background: #0369a1; }
</style>
</head>
<body>

<div class="header">
<h2>SiemenS Platform 🚀</h2>
</div>

<div class="balance-card">
<div class="balance-title">موجودی قابل برداشت</div>
<div class="balance-amount" id="userBalance">0.00 USDT</div>
</div>

<div class="grid">
<div class="stat-box">
<div class="balance-title">کل سپرده</div>
<div class="stat-value" id="userDeposit">0.00 USDT</div>
</div>
<div class="stat-box">
<div class="balance-title">سود روزانه</div>
<div class="stat-value" id="dailyProfit">0.00 USDT</div>
</div>
</div>

<button class="btn" onclick="Telegram.WebApp.close()">بازگشت به چت ربات</button>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
</script>
</body>
</html>
