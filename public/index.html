<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SiemenS Mini-App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0b0d1b; color: #ffffff; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .status { color: #00e676; font-size: 16px; font-weight: bold; margin-bottom: 25px; margin-top: 10px; }
        .card { background-color: #14172b; border-radius: 16px; padding: 20px; width: 100%; max-width: 380px; text-align: center; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .balance-title { color: #7f85a3; font-size: 14px; margin-bottom: 12px; }
        .balance-val { color: #00e676; font-size: 34px; font-weight: 800; }
        .reward-title { color: #7f85a3; font-size: 14px; margin-bottom: 14px; }
        .btn { background-color: #262c54; color: #ffffff; border: none; padding: 14px; border-radius: 12px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn:disabled { background-color: #1d213a; color: #5a607f; }
        .timer { color: #ffb74d; font-size: 13px; margin-top: 10px; }
        .ref-box { background-color: #0b0d1b; color: #64b5f6; padding: 12px; border-radius: 10px; font-size: 13px; word-break: break-all; margin-top: 12px; border: 1px dashed #262c54; }
        .sub-text { color: #ffffff; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="status">متصل شد</div>

    <div class="card">
        <div class="balance-title">موجودی حساب شما</div>
        <div class="balance-val">USDT <span id="balance">0.00</span></div>
    </div>

    <div class="card">
        <div class="reward-title">پاداش روزانه (۱ USDT)</div>
        <button class="btn" id="claimBtn">دریافت پاداش</button>
        <div class="timer" id="timer"></div>
    </div>

    <div class="card">
        <div class="reward-title">دعوت از دوستان (۰.۵ USDT پاداش)</div>
        <div class="sub-text">تعداد زیرمجموعه‌ها: 0 نفر</div>
        <div class="ref-box" id="refLink">https://t.me/SiemenS_bot</div>
    </div>

    <script>
        let balance = parseFloat(localStorage.getItem('user_balance') || '0.00');
        let lastClaim = parseInt(localStorage.getItem('last_claim') || '0');
        
        const balanceEl = document.getElementById('balance');
        const btn = document.getElementById('claimBtn');
        const timer = document.getElementById('timer');
        
        balanceEl.innerText = balance.toFixed(2);

        function checkTimer() {
            const now = Date.now();
            const COOLDOWN = 24 * 60 * 60 * 1000;
            if (now - lastClaim < COOLDOWN) {
                btn.disabled = true;
                btn.innerText = 'دریافت شد';
                const diff = COOLDOWN - (now - lastClaim);
                const h = Math.floor(diff / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                timer.innerText = دریافت بعدی: ${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s};
            } else {
                btn.disabled = false;
                btn.innerText = 'دریافت پاداش';
                timer.innerText = '';
            }
        }

        btn.addEventListener('click', function() {
            const now = Date.now();
            const COOLDOWN = 24 * 60 * 60 * 1000;
            if (now - lastClaim >= COOLDOWN) {
                balance += 1.0;
                lastClaim = now;
                localStorage.setItem('user_balance', balance);
                localStorage.setItem('last_claim', lastClaim);
                balanceEl.innerText = balance.toFixed(2);
                checkTimer();
            }
        });

        checkTimer();
        setInterval(checkTimer, 1000);
    </script>
</body>
</html>
