<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiemenS Mini-App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0d0f26;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .status {
            color: #00e676;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .card {
            background-color: #171a38;
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .balance-title {
            color: #8f93b0;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .balance-val {
            color: #00e676;
            font-size: 32px;
            font-weight: bold;
        }
        .reward-title {
            color: #8f93b0;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .btn {
            background-color: #2b305c;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:disabled {
            background-color: #484e5a;
            color: #9e9e9e;
            cursor: not-allowed;
        }
        .timer {
            color: #ffb74d;
            font-size: 14px;
            margin-top: 10px;
        }
        .ref-link {
            background-color: #0d0f26;
            color: #64b5f6;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            word-break: break-all;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="status" id="status">متصل شد</div>

    <div class="card">
        <div class="balance-title">موجودی حساب شما</div>
        <div class="balance-val">USDT <span id="balance">0.00</span></div>
    </div>

    <div class="card">
        <div class="reward-title">پاداش روزانه (۱ USDT)</div>
        <button class="btn" id="claimBtn" onclick="claimReward()">دریافت پاداش</button>
        <div class="timer" id="timer"></div>
    </div>

    <div class="card">
        <div class="reward-title">دعوت از دوستان (۰.۵ USDT پاداش)</div>
        <div>تعداد زیرمجموعه‌ها: <b id="refCount">0</b> نفر</div>
        <div class="ref-link" id="refLink">در حال دریافت لینک...</div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const userId = tg?.initDataUnsafe?.user?.id || '123456';
        const startParam = tg?.initDataUnsafe?.start_param || '';
        const botUsername = 'SiemenS_bot';

        const SERVER_URL = 'https://tether-bot-app.onrender.com';

        let timerInterval = null;

        function loadUserData() {
            fetch(${SERVER_URL}/api/user/${userId}?ref=${startParam})
                .then(res => res.json())
                .then(data => {
                    document.getElementById('balance').innerText = Number(data.balance).toFixed(2);
                    document.getElementById('refCount').innerText = data.referrals;
                    document.getElementById('refLink').innerText = https://t.me/${botUsername}?start=${userId};
                    
                    checkTimer(data.lastClaim);
                })
                .catch(err => {
                    document.getElementById('status').innerText = 'خطا در اتصال به سرور';
                    document.getElementById('status').style.color = '#ff5252';
                });
        }

        function checkTimer(lastClaim) {
            const COOLDOWN = 24 * 60 * 60 * 1000;
            const now = Date.now();
            const timePassed = now - lastClaim;

            if (lastClaim > 0 && timePassed < COOLDOWN) {
                startCountdown(COOLDOWN - timePassed);
            } else {
                enableButton();
            }
        }

        function startCountdown(remainingMs) {
            const btn = document.getElementById('claimBtn');
            btn.disabled = true;
            btn.innerText = 'دریافت شد';
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                remainingMs -= 1000;
                if (remainingMs <= 0) {
                    clearInterval(timerInterval);
                    enableButton();
                    return;
                }
                const hours = String(Math.floor(remainingMs / (1000 * 60 * 60))).padStart(2, '0');
                const minutes = String(Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
                const seconds = String(Math.floor((remainingMs % (1000 * 60)) / 1000)).padStart(2, '0');
                
                document.getElementById('timer').innerText = دریافت بعدی: ${hours}:${minutes}:${seconds};
            }, 1000);
        }

        function enableButton() {
            const btn = document.getElementById('claimBtn');
            btn.disabled = false;
            btn.innerText = 'دریافت پاداش';
            document.getElementById('timer').innerText = '';
        }

        function claimReward() {
            fetch(${SERVER_URL}/api/claim, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: userId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('balance').innerText = Number(data.newBalance).toFixed(2);
                    checkTimer(data.lastClaim);
                } else {
                    alert(data.message);
                }
            });
        }

        loadUserData();
    </script>
</body>
</html>
