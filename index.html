<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiemenS Mini-App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #121526; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .status { margin-bottom: 20px; font-size: 14px; color: #00e676; font-weight: bold; }
        .card { background-color: #1d2238; border-radius: 12px; padding: 20px; width: 100%; max-width: 350px; text-align: center; margin-bottom: 15px; }
        .title { color: #8a92b2; font-size: 14px; margin-bottom: 8px; }
        .balance { color: #00e676; font-size: 32px; font-weight: bold; }
        .btn { background-color: #00c853; color: white; border: none; padding: 14px; border-radius: 10px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn:disabled { background-color: #555; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="status" id="status">در حال اتصال...</div>

    <div class="card">
        <div class="title">موجودی حساب شما</div>
        <div class="balance"><span id="balance">0.00</span> USDT</div>
    </div>

    <div class="card">
        <div class="title">پاداش روزانه</div>
        <button class="btn" id="claimBtn" onclick="claimReward()">دریافت پاداش</button>
    </div>

    <script>
        const SERVER = 'https://tether-bot-app.onrender.com';
        let userId = '123456';

        // مقداردهی اولیه تلگرام
        document.addEventListener("DOMContentLoaded", function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
                if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                    userId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
                }
            }
            loadData();
        });

        function loadData() {
            document.getElementById('status').innerText = 'در حال دریافت اطلاعات...';
            fetch(${SERVER}/api/user/${userId})
                .then(res => res.json())
                .then(data => {
                    document.getElementById('balance').innerText = Number(data.balance).toFixed(2);
                    document.getElementById('status').innerText = 'متصل شد';
                })
                .catch(err => {
                    document.getElementById('status').innerText = 'سرور پاسخ نداد - دوباره تلاش کنید';
                });
        }

        function claimReward() {
            const btn = document.getElementById('claimBtn');
            btn.disabled = true;
            document.getElementById('status').innerText = 'در حال ثبت...';
            
            fetch(${SERVER}/api/claim, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: userId })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                if(data.success) {
                    document.getElementById('balance').innerText = Number(data.newBalance).toFixed(2);
                    document.getElementById('status').innerText = 'پاداش دریافت شد!';
                }
            })
            .catch(err => {
                btn.disabled = false;
                document.getElementById('status').innerText = 'خطا در شبکه!';
            });
        }
    </script>
</body>
</html>
