<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiemenS Mini-App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121526;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .status {
            margin-bottom: 20px;
            font-size: 14px;
            color: #00e676;
            font-weight: bold;
        }
        .card {
            background-color: #1d2238;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .title { color: #8a92b2; font-size: 14px; margin-bottom: 8px; }
        .balance { color: #00e676; font-size: 32px; font-weight: bold; }
        .btn {
            background-color: #00c853;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:disabled { background-color: #555; }
    </style>
</head>
<body>

    <div class="status" id="status">در حال اتصال به سرور...</div>

    <div class="card">
        <div class="title">موجودی حساب شما</div>
        <div class="balance"><span id="balance">0.00</span> USDT</div>
    </div>

    <div class="card">
        <div class="title">پاداش روزانه</div>
        <button class="btn" id="claimBtn" onclick="claimReward()">دریافت پاداش</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const SERVER_URL = 'https://tether-bot-app.onrender.com';
        const userId = tg.initDataUnsafe?.user?.id || '123456';

        function updateStatus(text, color) {
            const statusEl = document.getElementById('status');
            statusEl.innerText = text;
            if (color) statusEl.style.color = color;
        }

        async function fetchUserData() {
            try {
                const response = await fetch(${SERVER_URL}/api/user/${userId});
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                document.getElementById('balance').innerText = Number(data.balance).toFixed(2);
                updateStatus('متصل شد', '#00e676');
            } catch (error) {
                updateStatus('خطا در اتصال به سرور! دوباره تلاش کنید', '#ff5252');
            }
        }

        async function claimReward() {
            const btn = document.getElementById('claimBtn');
            btn.disabled = true;
            updateStatus('در حال ثبت پاداش...', '#ffab00');
            try {
                const response = await fetch(${SERVER_URL}/api/claim, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: String(userId) })
                });
                const data = await response.json();
                if (data.success) {
                    document.getElementById('balance').innerText = Number(data.newBalance).toFixed(2);
                    updateStatus('پاداش دریافت شد!', '#00e676');
                }
            } catch (error) {
                updateStatus('خطا در دریافت پاداش!', '#ff5252');
            } finally {
                btn.disabled = false;
            }
        }

        fetchUserData();
    </script>
</body>
</html>
